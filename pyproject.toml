[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riftprospect"
version = "0.1.1"
description = "Open prospectivity modeling for magmatic Ni-Cu-Co-PGE deposits in the Midcontinent Rift"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Bezali Kwame Danso", email = "dansobez@msu.edu"}, {name = "Adwoa Aduaba Aidoo"}, {name = "Saadatu Abdullah"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "rasterio>=1.3",
                "geopandas>=0.14", "pyproj>=3.5", "pyarrow>=12", "openpyxl>=3.1", "matplotlib>=3.7"]
keywords = ["mineral prospectivity", "critical minerals", "nickel", "platinum-group elements", "Midcontinent Rift", "geochemistry", "aeromagnetics"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License",
               "Topic :: Scientific/Engineering :: GIS", "Intended Audience :: Science/Research"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
riftprospect = "riftprospect.cli:main"

[project.urls]
Source = "https://github.com/bkdanso/riftprospect"

[tool.setuptools.packages.find]
where = ["src"]
